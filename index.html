<style>
  :root{
    --bg:#000000;
    --card:rgba(28,28,30,0.78);
    --card-solid:#1C1C1E;
    --card-hi:#2C2C2E;
    --fill:rgba(118,118,128,0.16);
    --border:rgba(255,255,255,0.08);
    --text:#F5F5F7;
    --text-dim:rgba(235,235,245,0.6);
    --text-tertiary:rgba(235,235,245,0.3);
    --accent:#0A84FF;
    --accent-dim:rgba(10,132,255,0.16);
    --danger:#FF453A;
    --success:#30D158;
    --warning:#FF9F0A;
    --mono:ui-monospace, 'SF Mono', Menlo, monospace;
    --display:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    --body:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    padding:0;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 60px;}

  /* ---- Responsive breakpoints ----
     Mobile   (<768px):  single column, execution-focused (default styles above)
     Tablet   (768-1023px): a bit more breathing room, still single column
     Desktop  (≥1024px): sidebar nav + multi-column analysis layouts */
  @media (min-width:768px){
    .wrap{max-width:680px;}
  }
  /* ---- Responsive breakpoints ----
     Mobile   (<768px):  single column, execution-focused (default styles above)
     Tablet   (768-1023px): a bit more breathing room, still single column
     Desktop  (≥1024px): wider container, multi-column analysis layouts inside Progress/Exercises */
  @media (min-width:768px){
    .wrap{max-width:680px;}
  }
  @media (min-width:1024px){
    .wrap{max-width:1100px;}
    .rings-card, .today-card, #today-dashboard, #workout-cards{max-width:640px;margin-left:0;margin-right:0;}
  }
  .hdr{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    padding:10px 16px;margin:0 -16px 14px;
  }
  .hdr h1{
    font-family:var(--display);
    font-weight:700;
    letter-spacing:-0.01em;
    font-size:20px;
    margin:0;
    white-space:nowrap;
  }
  .hdr-meta{display:flex;align-items:center;gap:10px;}
  .profile-menu-wrap{position:relative;}
  .profile-btn{
    background:transparent;border:none;color:var(--text-dim);
    font-size:20px;line-height:1;padding:4px 8px;cursor:pointer;border-radius:8px;
  }
  .profile-btn:hover{background:var(--fill);}
  .profile-menu{
    position:absolute;right:0;top:calc(100% + 6px);
    background:var(--card-solid);border:1px solid var(--border);border-radius:12px;
    padding:10px;min-width:150px;z-index:30;
    box-shadow:0 8px 24px rgba(0,0,0,0.45);
  }
  .profile-menu-date{font-size:12.5px;color:var(--text);margin-bottom:2px;font-variant-numeric:tabular-nums;}
  .profile-menu-sync{font-size:11.5px;color:var(--text-dim);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .profile-menu-item{
    width:100%;background:var(--fill);border:none;color:var(--text);
    font-size:13px;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500;
  }
  .hdr .date{
    color:var(--text-dim);
    font-size:13px;
    font-variant-numeric:tabular-nums;
  }

  /* ---- Rings dashboard (signature element) ---- */
  .rings-card{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:20px;
    padding:18px;margin-bottom:18px;
    display:flex;align-items:center;gap:18px;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.35);
  }
  .rings-visual{flex:0 0 auto;width:104px;height:104px;}
  .rings-visual svg{width:100%;height:100%;}
  .ring-track{fill:none;stroke:rgba(118,118,128,0.22);}
  .ring-progress{fill:none;stroke-linecap:round;transition:stroke-dashoffset 0.7s cubic-bezier(.22,1,.36,1);}
  .rings-legend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0;}
  .ring-metric{display:flex;align-items:center;gap:8px;font-size:14px;}
  .ring-metric .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .ring-metric .lbl{color:var(--text-dim);flex:1;}
  .ring-metric .val{
    font-weight:600;font-variant-numeric:tabular-nums;font-size:15px;
  }
  .dot-blue{background:var(--accent);}
  .dot-green{background:var(--success);}
  .dot-orange{background:var(--warning);}

  form.add{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:18px;
    padding:16px;margin-bottom:22px;
  }
  form.add .row{display:flex;gap:8px;margin-bottom:10px;}
  form.add .row:last-child{margin-bottom:0;}
  input, select{
    background:var(--fill);
    border:none;
    color:var(--text);
    padding:12px 14px;
    font-size:16px;
    border-radius:12px;
    width:100%;
    font-family:var(--body);
  }
  input:focus, select:focus{
    outline:none;box-shadow:0 0 0 3px var(--accent-dim);
  }
  input::placeholder{color:var(--text-tertiary);}
  .add-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    font-weight:600;
    font-size:17px;
    padding:13px;
    cursor:pointer;
    width:100%;
    border-radius:13px;
    font-family:var(--body);
    transition:transform .15s ease, opacity .15s ease;
  }
  .add-btn:active{transform:scale(0.97);opacity:0.85;}

  .day{margin-bottom:24px;}
  .day-hdr{
    color:var(--text-dim);
    font-size:13px;font-weight:600;
    letter-spacing:0.02em;
    padding:0 4px;margin-bottom:8px;
    display:flex;justify-content:space-between;
    font-variant-numeric:tabular-nums;
  }
  .ex-group{
    margin-bottom:14px;
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:16px;
    overflow:hidden;
  }
  .ex-name{
    font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:0.04em;
    color:var(--text-dim);
    padding:12px 14px 6px;
  }
  .set-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 14px;
    border-bottom:1px solid var(--border);
  }
  .set-row:last-child{border-bottom:none;}
  .set-row .idx{
    color:var(--text-tertiary);font-size:12px;width:16px;font-variant-numeric:tabular-nums;
  }
  .set-row .amt{
    font-size:15px;flex:1;font-variant-numeric:tabular-nums;
  }
  .set-row .amt b{color:var(--text);font-weight:600;}
  .tally{
    display:flex;gap:2px;align-items:flex-end;height:14px;margin-right:2px;
  }
  .tally span{width:2px;border-radius:1px;background:var(--text-tertiary);height:100%;}
  .set-row .actions{display:flex;gap:6px;}
  .icon-btn{
    background:var(--fill);border:none;
    color:var(--text-dim);width:28px;height:28px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:12px;border-radius:9px;padding:0;
    transition:background .15s ease;
  }
  .icon-btn:hover{background:var(--accent-dim);color:var(--accent);}
  .icon-btn.del:hover{background:rgba(255,69,58,0.16);color:var(--danger);}
  .edit-row{display:flex;gap:6px;flex:1;align-items:center;}
  .edit-row input{padding:7px 10px;font-size:14px;border-radius:9px;}
  .empty{
    color:var(--text-dim);text-align:center;padding:34px 16px;
    font-size:14px;background:var(--card);border:1px solid var(--border);border-radius:16px;
  }

  .unit-toggle{display:flex;background:var(--fill);border-radius:12px;padding:3px;overflow:hidden;}
  .unit-toggle button{
    flex:1;background:transparent;color:var(--text-dim);border:none;
    padding:9px 4px;font-size:13px;cursor:pointer;border-radius:9px;font-weight:600;
    transition:background .2s ease, color .2s ease;
  }
  .unit-toggle button.on{background:var(--card-hi);color:var(--text);}

  .tabs{position:relative;display:flex;background:var(--fill);border-radius:13px;padding:3px;margin-bottom:18px;}
  .tabs-thumb{
    position:absolute;top:3px;left:3px;
    width:calc(25% - 1.5px);height:calc(100% - 6px);
    background:var(--card-hi);border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.35);
    transition:transform .35s cubic-bezier(.22,1,.36,1);
  }
  .tabs button{
    flex:1;position:relative;z-index:1;background:transparent;border:none;color:var(--text-dim);
    font-family:var(--body);font-weight:600;
    font-size:13px;padding:8px 4px;cursor:pointer;
    transition:color .2s ease;
  }
  .tabs button.on{color:var(--text);}

  .view{display:none;}
  .view.on{display:block;}

  .ex-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .ex-pick button{
    background:var(--fill);border:none;color:var(--text-dim);
    padding:7px 13px;font-size:13px;border-radius:20px;cursor:pointer;font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .ex-pick button.on{background:var(--accent);color:#fff;font-weight:600;}

  .chart-card{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px;
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.3);
  }
  .chart-card h3{
    font-family:var(--display);font-weight:650;
    margin:0 0 4px;font-size:19px;letter-spacing:-0.01em;
  }
  .chart-meta{color:var(--text-dim);font-size:12.5px;margin-bottom:10px;font-variant-numeric:tabular-nums;}
  .pr-badge{color:var(--success);font-weight:600;}
  .hist-row{
    display:flex;justify-content:space-between;
    font-size:13.5px;
    padding:8px 0;border-bottom:1px solid var(--border);
    font-variant-numeric:tabular-nums;
  }
  .hist-row:last-child{border-bottom:none;}
  .hist-row .hd{color:var(--text-dim);}

  .my-ex-row-full{margin-bottom:10px;}
  .my-ex-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-bottom:none;
    padding:12px 14px;border-radius:14px 14px 0 0;
  }
  .my-ex-row span{font-size:14.5px;}
  .day-assign-row{
    display:flex;flex-wrap:wrap;gap:5px;
    background:var(--card);border:1px solid var(--border);border-top:none;
    padding:8px 10px 10px;border-radius:0 0 14px 14px;
  }
  .day-assign-pill{
    background:var(--fill);border:none;color:var(--text-dim);
    padding:5px 10px;border-radius:16px;font-size:11px;font-weight:500;cursor:pointer;
  }
  .day-assign-pill.on{background:var(--accent);color:#fff;font-weight:600;}

  .trend-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:600;
  }
  .trend-up{background:rgba(48,209,88,0.15);color:var(--success);}
  .trend-down{background:rgba(255,69,58,0.15);color:var(--danger);}
  .trend-flat{background:var(--fill);color:var(--text-dim);}

  .metric-toggle{display:flex;gap:6px;margin-bottom:12px;}
  .metric-toggle button{
    background:var(--fill);border:none;color:var(--text-dim);
    font-size:12.5px;padding:6px 11px;border-radius:20px;cursor:pointer;font-weight:500;
    transition:background .15s ease, color .15s ease;
  }
  .metric-toggle button.on{background:var(--accent);color:#fff;font-weight:600;}

  .heat-wrap{overflow-x:auto;padding-bottom:4px;}
  .heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;}
  .heat-cell{width:11px;height:11px;border-radius:3px;background:var(--fill);}
  .heat-cell.l1{background:rgba(10,132,255,0.35);}
  .heat-cell.l2{background:rgba(10,132,255,0.65);}
  .heat-cell.l3{background:var(--accent);}
  .heat-legend{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:var(--text-dim);}
  .streak-row{display:flex;gap:10px;margin-top:14px;}
  .streak-row .stat{
    flex:1;background:var(--fill);border-radius:12px;padding:10px 12px;
  }
  .streak-row .lbl{font-size:11px;color:var(--text-dim);margin-bottom:3px;}
  .streak-row .val{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;}

  #auth-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:20px;background:var(--bg);
  }
  .auth-icon{
    width:64px;height:64px;border-radius:16px;
    background:linear-gradient(160deg, var(--accent), #0050b3);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px;
    box-shadow:0 8px 20px rgba(10,132,255,0.35);
  }
  .auth-card{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:22px;
    padding:28px 24px;max-width:340px;width:100%;
    text-align:center;
  }
  .auth-card h1{
    font-family:var(--display);font-weight:750;letter-spacing:-0.02em;
    font-size:26px;margin:0;
  }
  .auth-card p{color:var(--text-dim);font-size:13.5px;margin:8px 0 18px;}
  .auth-card input{margin-bottom:10px;text-align:left;}
  .auth-error{color:var(--danger);font-size:13px;margin-bottom:4px;min-height:16px;}
  .auth-toggle{
    background:transparent;border:none;color:var(--accent);
    cursor:pointer;font-size:13.5px;margin-top:14px;padding:0;font-weight:500;
  }
  .sync-status{
    display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);
  }
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);transition:background .3s ease;}
  .sync-dot.off{background:var(--danger);}
  .signout-btn{
    background:var(--fill);border:none;color:var(--text-dim);
    font-size:11.5px;padding:6px 11px;border-radius:20px;cursor:pointer;font-weight:500;
  }

  /* ---- Session-centric workout dashboard ---- */
  .today-card{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:16px;
  }
  .today-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .today-eyebrow{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:2px;}
  .today-title{font-family:var(--display);font-weight:750;font-size:24px;letter-spacing:-0.01em;}
  .today-muscles{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .change-workout{
    background:var(--fill);border:none;color:var(--text-dim);font-size:12px;
    padding:6px 11px;border-radius:20px;cursor:pointer;font-weight:500;
  }
  .progress-track{background:var(--fill);height:8px;border-radius:5px;overflow:hidden;margin:12px 0 6px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:5px;transition:width 0.25s ease;}
  .today-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
  .rest-day-card{
    background:var(--card);border:1px solid var(--border);border-radius:18px;
    padding:26px 18px;text-align:center;margin-bottom:16px;
  }
  .rest-day-card .big{font-family:var(--display);font-weight:750;font-size:22px;margin-bottom:6px;}
  .rest-day-card .sub{color:var(--text-dim);font-size:13.5px;}
  .workout-picker{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
  .day-pill{
    background:var(--fill);border:none;color:var(--text-dim);
    padding:9px 13px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;
    transition:background .15s ease,color .15s ease;
  }
  .day-pill span{color:var(--text-tertiary);font-size:11px;margin-left:3px;}
  .day-pill.on{background:var(--accent);color:#fff;font-weight:600;}
  .day-pill.on span{color:rgba(255,255,255,0.75);}

  .wo-card{
    background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;
  }
  .wo-card.done{opacity:0.55;}
  .section-hdr{
    font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--text-tertiary);
    margin:14px 2px 6px;
  }
  .section-hdr:first-child{margin-top:2px;}
  .wo-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px;}
  .wo-name{font-weight:600;font-size:14.5px;line-height:1.25;}
  .wo-primary{color:var(--text-dim);font-size:11.5px;margin-bottom:6px;}
  .sub-tag{color:var(--warning);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .wo-target{color:var(--text-dim);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .wo-prev{
    font-size:12px;color:var(--text-dim);
    margin-bottom:8px;font-variant-numeric:tabular-nums;
  }
  .wo-prev b{color:var(--text);font-weight:600;}
  .set-progress-label{
    font-size:10.5px;font-weight:700;letter-spacing:0.06em;color:var(--accent);margin-bottom:5px;
  }
  .wo-set-row{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto 36px;
    gap:6px;align-items:center;margin-bottom:6px;
    border-radius:10px;
  }
  .wo-set-row.just-advanced{
    animation:pulseOnce 0.6s ease;
  }
  .wo-set-row input{padding:8px 8px;font-size:14px;border-radius:9px;min-width:0;width:100%;}
  .rir-pills{display:flex;gap:3px;}
  .rir-pill{
    background:var(--fill);border:none;color:var(--text-dim);width:26px;height:36px;
    border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;padding:0;
  }
  .rir-pill.on{background:var(--accent);color:#fff;}
  .wo-set-row .complete-btn{
    background:var(--accent);border:none;color:#fff;width:36px;height:36px;border-radius:9px;
    font-weight:700;cursor:pointer;flex:0 0 auto;
  }
  .wo-set-row.completed{
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;
    padding:5px 2px;font-size:13px;
    font-variant-numeric:tabular-nums;
    animation:rowIn 0.2s ease;
  }
  .wo-set-row.completed .chk{color:var(--success);font-weight:700;font-size:12px;}
  .wo-set-row.completed .set-tag{color:var(--text-dim);font-size:11.5px;min-width:52px;}
  .wo-set-row.completed .pr-flag{
    color:var(--warning);font-weight:700;margin-left:4px;font-size:10px;
    background:rgba(255,159,10,0.15);padding:1px 6px;border-radius:8px;
    animation:prPop 0.3s ease;
  }
  .wo-set-row.completed .delta-tag{
    color:var(--success);font-weight:600;font-size:10.5px;
  }
  .wo-prev-empty{color:var(--text-tertiary);font-style:italic;}
  .wo-prev .rir-at{color:var(--text-tertiary);}

<script>
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let unit = 'kg';
let sets = [];
let myExercises = [];
let currentUser = null;
let unsubscribeSnapshot = null;
let isCreatingAccount = false;
let suppressNextRemoteSave = false;

document.getElementById('today-label').textContent = new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

// ---- Profile menu (sign out lives here, tucked out of the way) ----
document.getElementById('profile-btn').onclick = (e) => {
  e.stopPropagation();
  const menu = document.getElementById('profile-menu');
  menu.style.display = menu.style.display==='none' ? 'block' : 'none';
};
document.addEventListener('click', (e) => {
  const menu = document.getElementById('profile-menu');
  if(menu && menu.style.display==='block' && !menu.contains(e.target) && e.target.id!=='profile-btn'){
    menu.style.display = 'none';
  }
});

document.getElementById('u-kg').onclick = () => setUnit('kg');
document.getElementById('u-lb').onclick = () => setUnit('lb');
function setUnit(u){
  unit = u;
  document.getElementById('u-kg').classList.toggle('on', u==='kg');
  document.getElementById('u-lb').classList.toggle('on', u==='lb');
}

// ---- Auth ----
document.getElementById('auth-toggle').onclick = () => {
  isCreatingAccount = !isCreatingAccount;
  document.getElementById('auth-submit').textContent = isCreatingAccount ? 'Create account' : 'Sign in';
  document.getElementById('auth-toggle').textContent = isCreatingAccount ? 'Already have an account? Sign in' : "Don't have an account? Create one";
  document.getElementById('auth-error').textContent = '';
};

document.getElementById('auth-submit').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Enter an email and password.'; return; }
  try{
    if(isCreatingAccount){
      await auth.createUserWithEmailAndPassword(email, password);
    }else{
      await auth.signInWithEmailAndPassword(email, password);
    }
  }catch(e){
    errEl.textContent = e.message.replace('Firebase: ','');
  }
};

document.getElementById('signout-btn').onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user){
    document.getElementById('auth-gate').style.display = 'none';
    document.getElementById('app-wrap').style.display = 'block';
    attachSync(user.uid);
  }else{
    document.getElementById('auth-gate').style.display = 'flex';
    document.getElementById('app-wrap').style.display = 'none';
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
  }
});

// ---- Firestore real-time sync ----
function attachSync(uid){
  const docRef = db.collection('users').doc(uid);
  setSyncStatus(true);
  unsubscribeSnapshot = docRef.onSnapshot(snap => {
    if(snap.exists){
      const data = snap.data();
      sets = data.sets ? JSON.parse(data.sets) : [];
      myExercises = data.myExercises ? JSON.parse(data.myExercises) : [];
      workoutSessions = data.workoutSessions ? JSON.parse(data.workoutSessions) : [];
      programOverrides = data.programOverrides ? JSON.parse(data.programOverrides) : {};
      customExercises = data.customExercises ? JSON.parse(data.customExercises) : {};
    }else{
      sets = [];
      myExercises = [];
      workoutSessions = [];
      programOverrides = {};
      customExercises = {};
    }
    render();
    if(activeTab === 'progress'){ renderInsights(); renderProgress(); }
    if(activeTab === 'logs'){ renderLogsTab(); }
    if(activeTab === 'exercises'){ renderMyExercises(); }
    setSyncStatus(true);
  }, err => {
    console.error('Sync error', err);
    setSyncStatus(false);
  });
}

function setSyncStatus(ok){
  document.getElementById('sync-dot').classList.toggle('off', !ok);
  document.getElementById('sync-label').textContent = ok ? 'Synced' : 'Offline';
}

async function saveExercises(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({ myExercises: JSON.stringify(myExercises) }, { merge: true });
    setSyncStatus(true);
  }catch(e){
    console.error('Could not save exercises', e);
    setSyncStatus(false);
  }
}

async function save(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({ sets: JSON.stringify(sets) }, { merge: true });
    setSyncStatus(true);
  }catch(e){
    console.error('Could not save', e);
    setSyncStatus(false);
  }
}

async function saveWorkoutSessions(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({ workoutSessions: JSON.stringify(workoutSessions) }, { merge: true });
    setSyncStatus(true);
  }catch(e){
    console.error('Could not save workout sessions', e);
    setSyncStatus(false);
  }
}

async function saveProgramOverrides(){
  if(!currentUser) return;
  try{
    await db.collection('users').doc(currentUser.uid).set({
      programOverrides: JSON.stringify(programOverrides),
      customExercises: JSON.stringify(customExercises)
    }, { merge: true });
    setSyncStatus(true);
  }catch(e){
    console.error('Could not save program overrides', e);
    setSyncStatus(false);
  }
}

function tallyMarks(n){
  const groups = Math.ceil(n/5);
  let html = '<div class="tally">';
  for(let i=0;i<Math.min(n,20);i++){

  }
  html += '</div>';
  return html;
}

function exMeta(id){
  return EXERCISE_LIBRARY[id] || customExercises[id] || { name:id, primaryMuscle:'', secondaryMuscles:[], type:'isolation', alternatives:[] };
}

function slugifyExerciseName(name){
  return 'custom-' + name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

function resolveExerciseIdByName(name){
  // Reuse a built-in library id if the name matches one exactly (case-insensitive) — avoids
  // creating a duplicate "custom" entry for an exercise that already exists in the library.
  const lower = name.trim().toLowerCase();
  const builtIn = Object.keys(EXERCISE_LIBRARY).find(id => EXERCISE_LIBRARY[id].name.toLowerCase() === lower);
  if(builtIn) return builtIn;
  const existingCustom = Object.keys(customExercises).find(id => customExercises[id].name.toLowerCase() === lower);
  if(existingCustom) return existingCustom;
  return slugifyExerciseName(name);
}

function getEffectiveProgram(program){
  // Base program exercises minus anything the user removed, plus anything the user added —
  // this is what every screen should read instead of PROGRAM_DATA directly, so program
  // customization actually takes effect everywhere.
  const overrides = programOverrides[program.name] || { removed:[], added:[] };
  const removed = overrides.removed || [];
  const added = overrides.added || [];
  const base = program.exercises.filter(ex => !removed.includes(ex.id));
  return base.concat(added);
}

function buildSessionDetailHTML(session){
  const sessionSets = sets.filter(s=>(session.setIds||[]).includes(s.id)).sort((a,b)=>a.timestamp-b.timestamp);
  const byExercise = [];
  sessionSets.forEach(s=>{
    let group = byExercise.find(g=>g.exercise===s.exercise);
    if(!group){ group = { exercise: s.exercise, sets: [] }; byExercise.push(group); }
    group.sets.push(s);
  });

  const programDef = Object.values(PROGRAM_DATA).find(p=>p.name===session.workoutName);
  const targetSets = programDef ? programDef.exercises.reduce((a,e)=>a+e.sets,0) : null;
  const isEarly = targetSets!=null && session.setCount < targetSets;
  const dateTimeStr = new Date(session.timestamp).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
    + ' • ' + new Date(session.timestamp).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});

  let html = '<div class="wo-card">';
  html += '<div class="wo-head"><span class="wo-name">'+escapeHtml(session.workoutName)+(isEarly?' <span class="sub-tag">completed early</span>':'')+'</span></div>';
  html += '<div class="log-detail-meta">'+dateTimeStr+'</div>';
  html += '<div class="log-detail-stats">'+session.duration+' min · '+session.setCount+(isEarly&&targetSets!=null?' / '+targetSets:'')+' working sets · '+session.totalReps+' reps · '+Math.round(session.volume).toLocaleString()+'kg'+(session.prCount>0?' · '+session.prCount+' PR'+(session.prCount>1?'s':''):'')+'</div>';

  byExercise.forEach(group=>{
    html += '<div class="view-ex-name">'+escapeHtml(group.exercise)+'</div>';
    let setNum = 0;
    group.sets.forEach(s=>{
      const label = s.isWarmup ? 'Warm-up' : 'Set '+(++setNum);
      html += '<div class="wo-set-row completed"><span class="chk">✓</span>'
        + '<span class="set-tag">'+label+'</span>'
        + '<b>'+s.weight+(s.unit||unit)+'</b> × '+s.reps+(s.rir!=null && !s.isWarmup?' · RIR '+s.rir:'')+'</div>';
    });
  });
  html += '</div>';
  return html;
}

function getSessionState(program){
  const todayKey = new Date().toDateString();
  // Every persisted, finished attempt at this workout, today — sorted oldest first.
  const completedSessions = workoutSessions
    .filter(w => w.dateKey===todayKey && w.workoutName===program.name)
    .sort((a,b)=>a.timestamp-b.timestamp);
  const attemptNumber = completedSessions.length + 1;
  const sessionId = todayKey+'_'+program.name+'_'+attemptNumber;
  // Has the *next* attempt already had sets logged into it? (e.g. resumed after a reload)
  const hasActiveSets = sets.some(s => s.workoutDay===program.name && fmtDateKey(s.timestamp)===todayKey && s.sessionId===sessionId);
  const latestCompleted = completedSessions.length ? completedSessions[completedSessions.length-1] : null;
  // Locked = there's a finished attempt, nothing has been logged into the next one yet,
  // and the person hasn't explicitly chosen to start another.
  const locked = !!latestCompleted && !hasActiveSets && !startNewAttempt[program.name];
  return { todayKey, completedSessions, attemptNumber, sessionId, hasActiveSets, latestCompleted, locked };
}

function findNextWorkoutDay(fromIdx){
  for(let i=1;i<=7;i++){
    const idx = (fromIdx+i)%7;
    if(PROGRAM_DATA[idx]) return { idx, daysAway:i };
  }
  return null;
}

function setsForExerciseOnDate(exerciseName, dateKey){
  return sets.filter(s=>s.exercise===exerciseName && fmtDateKey(s.timestamp)===dateKey);

function previousSessionSets(exerciseName, exerciseId, currentSessionId){
  // LAST = the most recent *completed* session (any workout type) that actually contains this
  // exact exercise, excluding the session currently being logged into. Session identity and
  // completion time decide this — never calendar date, since two sessions can share a date.
  const candidates = workoutSessions
    .filter(w => w.completed && w.id !== currentSessionId)
    .sort((a,b) => (b.completedAt||b.timestamp) - (a.completedAt||a.timestamp));

  for(const session of candidates){
    const sessionSets = sets.filter(s =>
      (session.setIds||[]).includes(s.id) && !s.isWarmup &&
      (exerciseId ? (s.exerciseId===exerciseId || s.exercise===exerciseName) : s.exercise===exerciseName)
    );
    if(sessionSets.length) return sessionSets.sort((a,b)=>a.timestamp-b.timestamp);
  }
  return [];
}

function hypertrophyScore(weight, reps){
  // Same idea as e1RM but caps the rep bonus at 12, so a 20kg×25 isolation set can't outrank a
  // 30kg×10 set purely because the formula rewards reps unboundedly — not meaningful for hypertrophy.
  const w = Number(weight)||0;
  const r = Math.min(Number(reps)||1, 12);
  if(w===0) return 0;
  return w * (1 + r/30);
}

const ASSISTANCE_BASELINE = 150; // comfortably above any real assisted-machine weight, used only for relative scoring

function performanceScore(weight, reps, isAssistance){
  if(isAssistance){
    // Less assistance weight = doing more of your own bodyweight = a *better* set, not worse.
    // Invert by scoring against a fixed baseline so "lower weight" maps to "higher score".
    const w = Math.max(0, ASSISTANCE_BASELINE - (Number(weight)||0));
    const r = Math.min(Number(reps)||1, 12);
    return w * (1 + r/30);
  }
  return hypertrophyScore(weight, reps);
}

function bestPerformance(exerciseName, exerciseId, currentSessionId){
  // BEST = the benchmark from BEFORE this session started. Sets logged in the session currently
  // being trained are deliberately excluded, so BEST stays fixed while you're mid-workout and only
  // updates for the *next* session once this one is finished.
  const isAssistance = exerciseId && EXERCISE_LIBRARY[exerciseId] && EXERCISE_LIBRARY[exerciseId].assistance;
  const valid = sets.filter(s =>
    !s.isWarmup && Number(s.weight)>0 && Number(s.reps)>0 && s.sessionId!==currentSessionId &&
    (exerciseId ? (s.exerciseId===exerciseId || s.exercise===exerciseName) : s.exercise===exerciseName)
  );
  if(valid.length===0) return null;
  let best = valid[0];
  let bestScore = performanceScore(best.weight, best.reps, isAssistance);
  valid.forEach(s=>{
    const score = performanceScore(s.weight, s.reps, isAssistance);
    if(score > bestScore){ bestScore = score; best = s; }
  });
  return best;
}

function checkAndFlagPR(exerciseName, exerciseId, weight, reps, currentSessionId){
  // A meaningful "performance PR" against the pre-session BEST — weight + reps together (capped),
  // not just whichever single number happens to be biggest. For assistance-based exercises
  // (like Assisted Pull-Ups), less assistance weight counts as the improvement, not more.
  if(!weight || Number(weight)<=0 || !reps || Number(reps)<=0) return false;
  const isAssistance = exerciseId && EXERCISE_LIBRARY[exerciseId] && EXERCISE_LIBRARY[exerciseId].assistance;
  const priorWorking = sets.filter(s =>
    !s.isWarmup && Number(s.weight)>0 && Number(s.reps)>0 && s.sessionId!==currentSessionId &&
    (exerciseId ? (s.exerciseId===exerciseId || s.exercise===exerciseName) : s.exercise===exerciseName)
  );
  if(priorWorking.length===0) return false;
  const bestPriorScore = Math.max(...priorWorking.map(s=>performanceScore(s.weight, s.reps, isAssistance)));
  return performanceScore(weight, reps, isAssistance) > bestPriorScore;
}

function startRestTimer(seconds, exerciseName, exIdx){
  if(restTimer.intervalId) clearInterval(restTimer.intervalId);
  restTimer.running = true;
  restTimer.secondsLeft = seconds;
  restTimer.exerciseName = exerciseName;
  restTimer.intervalId = setInterval(()=>{
    restTimer.secondsLeft--;
    if(restTimer.secondsLeft<=0){
      clearInterval(restTimer.intervalId);
      restTimer.running=false;
      if(navigator.vibrate) navigator.vibrate(200);
      justAdvancedIdx = exIdx;
      renderWorkoutCards(); // full re-render only when the timer actually finishes, to reveal the next set
    }else{
      // just update the countdown text in place — never rebuild the DOM while resting
      const timerEl = document.querySelector('.rest-banner .timer');
      if(timerEl) timerEl.textContent = fmtTimer(restTimer.secondsLeft);
    }
  }, 1000);
  renderWorkoutCards();
}

function fmtTimer(sec){
  const m = Math.floor(Math.max(0,sec)/60);
  const s = Math.max(0,sec)%60;
  return m+':'+String(s).padStart(2,'0');
}

function renderWorkoutCards(){
  const el = document.getElementById('workout-cards');
  const program = PROGRAM_DATA[activeDayIndex];
  if(!program){ el.innerHTML=''; return; }

  const state = getSessionState(program);

  // Reviewing a finished session read-only — no inputs, no ✓, nothing editable.
  if(viewingCompletedId){
    const session = workoutSessions.find(w=>w.id===viewingCompletedId);
    if(session){
      let html = buildSessionDetailHTML(session);
      html += '<button type="button" class="add-warmup-link" id="back-from-view">← Back</button>';
      el.innerHTML = html;
      document.getElementById('back-from-view').onclick = ()=>{ viewingCompletedId=null; renderWorkoutCards(); };
      return;
    }
    viewingCompletedId = null; // stale reference, fall through
  }

  // A finished attempt exists today and nothing new has been started yet — show the locked/complete state.
  if(state.locked){
    const session = finishedSummary && finishedSummary.workoutName===program.name && finishedSummary.sessionId===state.latestCompleted.id
      ? finishedSummary
      : { workoutName: state.latestCompleted.workoutName, duration: state.latestCompleted.duration,
          setCount: state.latestCompleted.setCount, totalReps: state.latestCompleted.totalReps,
          volume: state.latestCompleted.volume, prCount: state.latestCompleted.prCount, prevVolume: null };
    el.innerHTML = renderSummaryCard(session, true);
    const viewBtn = document.getElementById('view-completed-btn');
    if(viewBtn) viewBtn.onclick = ()=>{ viewingCompletedId = state.latestCompleted.id; renderWorkoutCards(); };
    const startAnotherBtn = document.getElementById('start-another-btn');
    if(startAnotherBtn) startAnotherBtn.onclick = ()=>{
      if(!confirm('Start another '+program.name+' workout? This begins a new session.')) return;
      startNewAttempt[program.name] = true;
      finishedSummary = null;
      renderTodayDashboard();
      renderWorkoutCards();
    };
    return;
  }

  const todayKey = state.todayKey;
  let html = '';
  let lastSection = null;

  const effectiveExercises = getEffectiveProgram(program);
  effectiveExercises.forEach((ex, exIdx)=>{
    if(ex.section && ex.section !== lastSection){
      html += '<div class="section-hdr">'+escapeHtml(ex.section.toUpperCase())+'</div>';
      lastSection = ex.section;
    }

    const effectiveId = substitutions[exIdx] || ex.id;
    const meta = exMeta(effectiveId);
    const exName = meta.name;
    const isSubstituted = !!substitutions[exIdx];
    const prev = previousSessionSets(exName, effectiveId, state.sessionId);
    const todaysSets = sets.filter(s=>s.exercise===exName && s.workoutDay===program.name && fmtDateKey(s.timestamp)===todayKey && s.sessionId===state.sessionId)
      .sort((a,b)=>a.timestamp-b.timestamp);
    const doneCount = todaysSets.filter(s=>!s.isWarmup).length;
    const cardDone = doneCount >= ex.sets;
    const inWarmupMode = !!pendingWarmup[exIdx];
    const rir = pendingRir[exIdx] != null ? pendingRir[exIdx] : 2;

    html += '<div class="wo-card'+(cardDone?' done':'')+'" data-ex="'+exIdx+'">';
    html += '<div class="wo-head"><span class="wo-name">'+escapeHtml(exName)+(isSubstituted?' <span class="sub-tag">substituted</span>':'')+'</span><span class="wo-target">'+ex.sets+' × '+ex.repMin+'–'+ex.repMax+'</span></div>';
    html += '<div class="wo-primary">'+escapeHtml(meta.primaryMuscle)+'</div>';

    if(prev.length){
      html += '<div class="wo-prev"><span class="lb-tag">LAST</span> '+prev.map(s=>'<b>'+s.weight+(s.unit||unit)+'</b>×'+s.reps+(s.rir!=null?' <span class="rir-at">@'+s.rir+'</span>':'')).join(' • ')+'</div>';
    }else{
      html += '<div class="wo-prev wo-prev-empty"><span class="lb-tag">LAST</span> No previous data</div>';
    }

    const best = bestPerformance(exName, effectiveId, state.sessionId);
    if(best){
      html += '<div class="wo-best"><span class="lb-tag lb-tag-dim">BEST</span> <b>'+best.weight+(best.unit||unit)+'</b> × '+best.reps+'</div>';
    }

    const workingToday = todaysSets.filter(s=>!s.isWarmup);
    if(!inWarmupMode && workingToday.length >= ex.sets && workingToday.length > 0 && workingToday.every(s=>Number(s.reps) >= ex.repMax)){
      html += '<div class="target-hit">Target reached — consider increasing weight next session.</div>';
    }

    // completed rows — compact
    todaysSets.forEach((s,i)=>{
      const prTag = s.pr ? '<span class="pr-flag">NEW PR</span>' : '';
      const marker = s.isWarmup ? 'W' : (i - todaysSets.slice(0,i).filter(x=>x.isWarmup).length + 1);
      let deltaTag = '';
      if(!s.isWarmup && !s.pr && typeof marker === 'number' && prev[marker-1]){
        const prevSet = prev[marker-1];
        if(Number(s.weight)===Number(prevSet.weight) && Number(s.reps)>Number(prevSet.reps)){
          deltaTag = '<span class="delta-tag">↑ +'+(Number(s.reps)-Number(prevSet.reps))+' reps</span>';
        }else if(Number(s.weight)>Number(prevSet.weight) && Number(s.reps)>=Number(prevSet.reps)-1){
          deltaTag = '<span class="delta-tag">↑ +'+(Math.round((Number(s.weight)-Number(prevSet.weight))*10)/10)+(s.unit||unit)+'</span>';
        }
      }
      html += '<div class="wo-set-row completed"><span class="chk">✓</span>'
        + '<span class="set-tag">'+(s.isWarmup?'Warm-up':'Set '+marker)+'</span>'
        + '<b>'+s.weight+(s.unit||unit)+'</b> × '+s.reps+(s.rir!=null && !s.isWarmup?' · RIR '+s.rir:'')+prTag+deltaTag+'</div>';
    });

    // rest timer banner if this is the active exercise
    if(restTimer.running && restTimer.exerciseName===exName){
      html += '<div class="rest-banner"><span class="rest-label">REST</span><span class="timer">'+fmtTimer(restTimer.secondsLeft)+'</span>'
        +'<div class="rest-actions">'
        +'<button data-rest-add30="'+exIdx+'">+30s</button>'
        +'<button data-rest-skip="'+exIdx+'">Skip</button>'
        +'</div></div>';
    }

    // next input row, only if not done and no active rest timer for this exercise
    if((!cardDone || inWarmupMode) && !(restTimer.running && restTimer.exerciseName===exName)){
      const nextSetNum = doneCount+1;
      const historicalWeight = todaysSets.filter(s=>!s.isWarmup).length
        ? todaysSets.filter(s=>!s.isWarmup)[todaysSets.filter(s=>!s.isWarmup).length-1].weight
        : (prev.length ? prev[Math.min(nextSetNum-1,prev.length-1)].weight : '');
      // Weight/Reps for the row in progress live in pendingSetInput (JS state), not just the DOM —
      // this is what survives RIR changes, warm-up toggles and any other re-render.
      const pending = pendingSetInput[exIdx] || {};
      const weightVal = pending.weight !== undefined ? pending.weight : (historicalWeight || '');
      const repsVal = pending.reps !== undefined ? pending.reps : '';

      const justAdvanced = justAdvancedIdx === exIdx;
      html += '<div class="set-progress-label">'+(inWarmupMode ? 'WARM-UP SET' : 'SET '+nextSetNum+' / '+ex.sets)+'</div>';
      html += '<div class="wo-set-row'+(justAdvanced?' just-advanced':'')+'">'
        +'<input type="number" inputmode="decimal" class="w-input" id="w-'+exIdx+'" placeholder="Weight" value="'+weightVal+'" step="0.5">'
        +'<input type="number" inputmode="numeric" class="r-input" id="r-'+exIdx+'" placeholder="Reps" value="'+repsVal+'">'
        + (inWarmupMode ? '' : '<div class="rir-pills" id="rir-pills-'+exIdx+'">'
            + [0,1,2,3,4].map(v=>'<button type="button" class="rir-pill'+(rir===v?' on':'')+'" data-rir="'+exIdx+':'+v+'">'+(v===4?'4+':v)+'</button>').join('')
          +'</div>')
        +'<button class="complete-btn" data-complete="'+exIdx+'" data-warmup="'+inWarmupMode+'">✓</button>'
      +'</div>';

      if(!inWarmupMode){
        html += '<button type="button" class="add-warmup-link" data-addwarmup="'+exIdx+'">+ Add warm-up set</button>';
      }
    }

    if(!isSubstituted || true){
      html += '<div class="card-actions-row">'
        +'<button type="button" class="sub-link" data-subtoggle="'+exIdx+'">Substitute</button>'
        +'<button type="button" class="sub-link sub-link-danger" data-removeex="'+exIdx+'">Remove</button>'
      +'</div>';
      if(openSubMenu === exIdx){
        const altIds = EXERCISE_LIBRARY[ex.id] ? EXERCISE_LIBRARY[ex.id].alternatives : [];
        html += '<div class="sub-panel"><div class="sub-panel-hdr">Alternatives</div>';
        if(altIds && altIds.length){
          altIds.forEach(altId=>{
            const altMeta = exMeta(altId);
            html += '<button type="button" class="sub-option" data-subpick="'+exIdx+':'+altId+'">'+escapeHtml(altMeta.name)+' <span>(today only)</span></button>';
          });
          if(isSubstituted){
            html += '<button type="button" class="sub-option sub-revert" data-subrevert="'+exIdx+'">Revert to '+escapeHtml(exMeta(ex.id).name)+'</button>';
          }
        }else{
          html += '<div class="sub-empty">No alternatives saved.</div>';
        }
        html += '<button type="button" class="sub-close" data-subtoggle="'+exIdx+'">Close</button></div>';
      }
    }

    html += '</div>';
  });

  html += '<div class="add-ex-section">';
  if(showAddExercisePicker){
    const alreadyInToday = new Set(effectiveExercises.map(e=>e.id));
    const pickable = myExercises.filter(name => !alreadyInToday.has(resolveExerciseIdByName(name)));
    html += '<div class="sub-panel"><div class="sub-panel-hdr">Add from your exercises</div>';
    if(pickable.length){
      pickable.forEach(name=>{
        html += '<button type="button" class="sub-option" data-addtoday="'+escapeHtml(name)+'">'+escapeHtml(name)+'</button>';
      });
    }else{
      html += '<div class="sub-empty">Nothing left to add — everything in your saved list is already in today\u2019s workout. Add more from the Exercises tab.</div>';
    }
    html += '<button type="button" class="sub-close" id="close-add-ex">Close</button></div>';
  }else{
    html += '<button type="button" class="add-warmup-link" id="open-add-ex">+ Add exercise</button>';
  }
  html += '</div>';

  html += '<div class="finish-bar"><button id="finish-workout-btn">Finish workout</button></div>';
  el.innerHTML = html;
  justAdvancedIdx = null; // consumed — the pulse only plays on the render right after rest ends

  // Keep pendingSetInput in sync with what's actually typed, so any later re-render
  // (RIR change, warm-up toggle, timer finishing) can restore it exactly.
  el.querySelectorAll('.w-input').forEach(inp=>{
    const idx = inp.id.replace('w-','');
    inp.oninput = ()=>{ if(!pendingSetInput[idx]) pendingSetInput[idx] = {}; pendingSetInput[idx].weight = inp.value; };
  });
  el.querySelectorAll('.r-input').forEach(inp=>{
    const idx = inp.id.replace('r-','');
    inp.oninput = ()=>{ if(!pendingSetInput[idx]) pendingSetInput[idx] = {}; pendingSetInput[idx].reps = inp.value; };
  });

  el.querySelectorAll('[data-complete]').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.disabled) return; // guards against rapid double-taps creating duplicate sets
      btn.disabled = true;
      completeSet(Number(btn.getAttribute('data-complete')), btn.getAttribute('data-warmup')==='true');
    };
  });
  el.querySelectorAll('[data-rest-add30]').forEach(btn=>{
    btn.onclick = ()=>{
      restTimer.secondsLeft+=30;
      const timerEl = document.querySelector('.rest-banner .timer');
      if(timerEl) timerEl.textContent = fmtTimer(restTimer.secondsLeft);
    };
  });
  el.querySelectorAll('[data-rest-skip]').forEach(btn=>{
    btn.onclick = ()=>{ clearInterval(restTimer.intervalId); restTimer.running=false; renderWorkoutCards(); };
  });
  el.querySelectorAll('[data-rir]').forEach(btn=>{
    btn.onclick = ()=>{
      const [idx,val] = btn.getAttribute('data-rir').split(':');
      pendingRir[idx] = Number(val);
      renderWorkoutCards();
    };
  });
  el.querySelectorAll('[data-addwarmup]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.getAttribute('data-addwarmup');
      pendingWarmup[idx] = true;
      delete pendingSetInput[idx];
      renderWorkoutCards();
    };
  });
  el.querySelectorAll('[data-subtoggle]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.getAttribute('data-subtoggle'));
      openSubMenu = openSubMenu===idx ? null : idx;
      renderWorkoutCards();
    };
  });
  el.querySelectorAll('[data-subpick]').forEach(btn=>{
    btn.onclick = ()=>{
      const [idx,altId] = btn.getAttribute('data-subpick').split(':');
      substitutions[idx] = altId;
      openSubMenu = null;
      renderWorkoutCards();
    };
  });
  el.querySelectorAll('[data-subrevert]').forEach(btn=>{
    btn.onclick = ()=>{
      delete substitutions[btn.getAttribute('data-subrevert')];
      openSubMenu = null;
      renderWorkoutCards();
    };
  });
  el.querySelectorAll('[data-removeex]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = Number(btn.getAttribute('data-removeex'));
      const ex = effectiveExercises[idx];
      const meta = exMeta(ex.id);
      if(!confirm('Remove '+meta.name+' from today\u2019s '+program.name+'? This only affects today \u2014 it stays in your program for next time.')) return;

      if(!programOverrides[program.name]) programOverrides[program.name] = { removed:[], added:[] };
      const isBaseExercise = program.exercises.some(e=>e.id===ex.id);
      if(isBaseExercise){
        programOverrides[program.name].removed.push(ex.id);
      }else{
        programOverrides[program.name].added = (programOverrides[program.name].added||[]).filter(a=>a.id!==ex.id);
      }
      saveProgramOverrides();

      // Removing an exercise shifts every later card's index, so any not-yet-submitted typing
      // on other cards can no longer be trusted to line up correctly — safer to clear it than
      // risk it silently attaching to the wrong exercise.
      pendingRir = {}; pendingWarmup = {}; substitutions = {}; openSubMenu = null; pendingSetInput = {};
      renderTodayDashboard();
      renderWorkoutCards();
    };
  });
  const finishBtn = document.getElementById('finish-workout-btn');
  if(finishBtn) finishBtn.onclick = finishWorkout;

  const openAddBtn = document.getElementById('open-add-ex');
  if(openAddBtn) openAddBtn.onclick = ()=>{ showAddExercisePicker = true; renderWorkoutCards(); };
  const closeAddBtn = document.getElementById('close-add-ex');
  if(closeAddBtn) closeAddBtn.onclick = ()=>{ showAddExercisePicker = false; renderWorkoutCards(); };
  el.querySelectorAll('[data-addtoday]').forEach(btn=>{
    btn.onclick = ()=>{
      const name = btn.getAttribute('data-addtoday');
      const id = resolveExerciseIdByName(name);
      if(!EXERCISE_LIBRARY[id] && !customExercises[id]){
        customExercises[id] = { name, primaryMuscle:'', secondaryMuscles:[], type:'isolation', alternatives:[] };
      }
      if(!programOverrides[program.name]) programOverrides[program.name] = { removed:[], added:[] };
      const already = programOverrides[program.name].added.some(a=>a.id===id) || program.exercises.some(e=>e.id===id);
      if(!already){
        programOverrides[program.name].added.push({ id, sets:3, repMin:8, repMax:12, rest:90, section:'Added' });
      }
      saveProgramOverrides();
      showAddExercisePicker = false;
      renderTodayDashboard();
      renderWorkoutCards();
    };
  });
}

function completeSet(exIdx, isWarmup){
  const program = PROGRAM_DATA[activeDayIndex];
  const ex = getEffectiveProgram(program)[exIdx];
  const state = getSessionState(program);
  const effectiveId = substitutions[exIdx] || ex.id;
  const meta = exMeta(effectiveId);
  const weight = document.getElementById('w-'+exIdx).value;
  const reps = document.getElementById('r-'+exIdx).value;
  const rir = isWarmup ? null : (pendingRir[exIdx] != null ? pendingRir[exIdx] : 2);
  if(!reps || Number(reps)<=0){
    alert('Enter a valid rep count.');
    const btn = document.querySelector('[data-complete="'+exIdx+'"]');
    if(btn) btn.disabled = false; // validation failed — let them try again without a re-render
    return;
  }

  const pr = !isWarmup && checkAndFlagPR(meta.name, effectiveId, weight, reps, state.sessionId);

  sets.push({
    id:'set_'+Date.now()+'_'+Math.floor(Math.random()*1000),
    exercise: meta.name,
    exerciseId: effectiveId,
    weight: weight ? Number(weight) : 0,
    reps: Number(reps),
    unit,
    timestamp: Date.now(),
    workoutDay: program.name,
    sessionId: state.sessionId,
    rir,
    isWarmup,
    pr
  });
  save();
  pendingWarmup[exIdx] = false;
  delete pendingSetInput[exIdx]; // this row is done — the next one starts fresh from history, not leftover text
  renderTodayDashboard();
  if(!isWarmup) startRestTimer(ex.rest, meta.name, exIdx);
  else renderWorkoutCards();
}

function renderSummaryCard(summary, locked){
  const volDelta = summary.prevVolume ? Math.round(((summary.volume-summary.prevVolume)/summary.prevVolume)*1000)/10 : null;
  return '<div class="summary-card">'
    +'<div class="big">'+summary.workoutName.toUpperCase()+(locked?' COMPLETED':' COMPLETE')+'</div>'
    +'<div class="summary-grid">'
      +'<div class="cell"><div class="lbl">Duration</div><div class="val">'+summary.duration+' min</div></div>'
      +'<div class="cell"><div class="lbl">Working sets</div><div class="val">'+summary.setCount+'</div></div>'
      +'<div class="cell"><div class="lbl">Total reps</div><div class="val">'+summary.totalReps+'</div></div>'
      +'<div class="cell"><div class="lbl">Volume</div><div class="val">'+Math.round(summary.volume).toLocaleString()+'</div></div>'
    +'</div>'
    +(summary.prCount>0 ? '<div class="summary-delta">🏆 '+summary.prCount+' new PR'+(summary.prCount>1?'s':'')+'</div>' : '')
    +(volDelta!==null ? '<div class="summary-delta">Volume vs last '+summary.workoutName+': '+(volDelta>=0?'+':'')+volDelta+'%</div>' : '')
    + (locked
        ? '<button class="add-btn" id="view-completed-btn" style="margin-top:14px;">View Workout</button>'
          +'<button class="finish-bar-btn-secondary" id="start-another-btn" style="margin-top:8px;">Start Another Workout</button>'
        : '<button class="add-btn" id="dismiss-summary" style="margin-top:14px;">Back to log</button>')
  +'</div>';
}

function finishWorkout(){
  const program = PROGRAM_DATA[activeDayIndex];
  const state = getSessionState(program);
  const todayKey = state.todayKey;
  const sessionId = state.sessionId;
  // Only this session's own sets — never a previously-completed attempt's sets.
  const todaysAll = sets.filter(s=>s.workoutDay===program.name && fmtDateKey(s.timestamp)===todayKey && s.sessionId===sessionId);
  const working = todaysAll.filter(s=>!s.isWarmup);
  const targetSets = getEffectiveProgram(program).reduce((a,e)=>a+e.sets,0);

  if(working.length===0){
    if(!confirm('No working sets have been logged. Finish anyway?')) return;
  }else if(working.length < targetSets){
    if(!confirm(working.length+' of '+targetSets+' working sets completed. Finish workout?')) return;
  }

  const firstTs = todaysAll.length ? Math.min(...todaysAll.map(s=>s.timestamp)) : Date.now();
  const lastTs = todaysAll.length ? Math.max(...todaysAll.map(s=>s.timestamp)) : Date.now();
  const duration = Math.max(1, Math.round((lastTs-firstTs)/60000));
  const totalReps = working.reduce((a,s)=>a+Number(s.reps),0);
  const volume = working.reduce((a,s)=>a+(Number(s.weight)||0)*Number(s.reps),0);
  const prCount = working.filter(s=>s.pr).length;
  const exerciseCount = new Set(working.map(s=>s.exercise)).size;

  const priorDates = [...new Set(sets.filter(s=>s.workoutDay===program.name && fmtDateKey(s.timestamp)!==todayKey && !s.isWarmup).map(s=>fmtDateKey(s.timestamp)))];
  let prevVolume = null;
  if(priorDates.length){
    const lastDate = priorDates.sort((a,b)=>new Date(b)-new Date(a))[0];
    const prevSets = sets.filter(s=>s.workoutDay===program.name && fmtDateKey(s.timestamp)===lastDate && !s.isWarmup);
    prevVolume = prevSets.reduce((a,s)=>a+(Number(s.weight)||0)*Number(s.reps),0);
  }

  // Persist this as a completed, immutable historical record — this is now the single source of
  // truth for "is this workout done", not just a locally-rendered summary.
  const existingIdx = workoutSessions.findIndex(w=>w.id===sessionId);
  const sessionRecord = {
    id: sessionId,
    workoutName: program.name,
    dateKey: todayKey,
    timestamp: firstTs,
    duration,
    setCount: working.length,
    exerciseCount,
    totalReps,
    volume,
    prCount,
    setIds: todaysAll.map(s=>s.id),
    completed: true,
    completedAt: Date.now()
  };
  if(existingIdx>=0) workoutSessions[existingIdx] = sessionRecord;
  else workoutSessions.push(sessionRecord);
  saveWorkoutSessions();

  startNewAttempt[program.name] = false; // this attempt is now closed — the next one needs an explicit "Start Another Workout"
  finishedSummary = { workoutName:program.name, sessionId, duration, setCount:working.length, totalReps, volume, prCount, prevVolume };
  renderTodayDashboard();
  renderWorkoutCards();
}

function render(){
  renderTodayDashboard();
  renderWorkoutCards();

  const exNames = [...new Set([...myExercises, ...sets.map(s=>s.exercise)])];
  const dl = document.getElementById('exercise-list');
  dl.innerHTML = exNames.map(n=>'<option value="'+escapeHtml(n)+'">').join('');

  const qp = document.getElementById('quick-pick');
  if(myExercises.length === 0){
    qp.innerHTML = '';
  }else{
    qp.innerHTML = myExercises.map(n=>
      '<button type="button" data-quick="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>'
    ).join('');
    qp.querySelectorAll('[data-quick]').forEach(btn=>{
      btn.onclick = () => {
        document.getElementById('f-exercise').value = btn.getAttribute('data-quick');
        document.getElementById('f-reps').focus();
      };
    });
  }

  const todayKey = new Date().toDateString();

  const log = document.getElementById('log');
  if(sets.length === 0){
    log.innerHTML = '<div class="empty">No sets logged yet. Add your first one above.</div>';
    return;
  }

  const byDay = {};
  sets.slice().sort((a,b)=>b.timestamp-a.timestamp).forEach(s=>{
    const key = fmtDateKey(s.timestamp);
    if(!byDay[key]) byDay[key] = [];
    byDay[key].push(s);
  });

  let html = '';
  for(const dayKey of Object.keys(byDay)){
    const daySets = byDay[dayKey];
    const dayVol = daySets.reduce((a,s)=>a+(Number(s.weight)||0)*Number(s.reps),0);
    const label = dayKey === todayKey ? 'Today' : new Date(dayKey).toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});
    html += '<div class="day"><div class="day-hdr"><span>'+label+'</span><span>'+Math.round(dayVol).toLocaleString()+' vol</span></div>';

    const byEx = {};
    daySets.forEach(s=>{
      if(!byEx[s.exercise]) byEx[s.exercise] = [];
      byEx[s.exercise].push(s);
    });

    for(const ex of Object.keys(byEx)){
      html += '<div class="ex-group"><div class="ex-name">'+escapeHtml(ex)+'</div>';
      byEx[ex].forEach((s, idx) => {
        html += renderSetRow(s, idx+1);
      });
      html += '</div>';
    }
    html += '</div>';
  }
  log.innerHTML = html;

  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = () => startEdit(btn.getAttribute('data-edit'));
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = () => deleteSet(btn.getAttribute('data-del'));
  });
  document.querySelectorAll('[data-save]').forEach(btn=>{
    btn.onclick = () => saveEdit(btn.getAttribute('data-save'));
  });
}

function renderSetRow(s, idx){
  const weightLabel = s.weight ? s.weight+s.unit : 'BW';
  return '<div class="set-row" id="row-'+s.id+'">'
    +'<span class="idx">'+idx+'</span>'
    +tallyMarks(Number(s.reps))
    +'<span class="amt"><b>'+weightLabel+'</b> &times; '+s.reps+' reps</span>'
    +'<div class="actions">'
      +'<button class="icon-btn" data-edit="'+s.id+'" aria-label="Edit set">Edit</button>'
      +'<button class="icon-btn del" data-del="'+s.id+'" aria-label="Delete set">Del</button>'
    +'</div>'
  +'</div>';
}

function startEdit(id){
  const s = sets.find(x=>x.id===id);
  if(!s) return;
  const row = document.getElementById('row-'+id);
  row.innerHTML = '<div class="edit-row">'
    +'<input type="number" id="ew-'+id+'" value="'+(s.weight||'')+'" placeholder="Weight" step="0.5" style="width:70px">'
    +'<input type="number" id="er-'+id+'" value="'+s.reps+'" placeholder="Reps" style="width:60px">'
    +'<button class="icon-btn" data-save="'+id+'" aria-label="Save">Save</button>'
  +'</div>';
  document.getElementById('ew-'+id).focus();
  document.querySelector('[data-save="'+id+'"]').onclick = () => saveEdit(id);
}

function saveEdit(id){
  const w = document.getElementById('ew-'+id).value;
  const r = document.getElementById('er-'+id).value;
  if(!r || Number(r) <= 0){
    alert('Enter a valid rep count.');
    return;
  }
  const s = sets.find(x=>x.id===id);
  s.weight = w ? Number(w) : 0;
  s.reps = Number(r);
  save();
  render();
}

function deleteSet(id){
  sets = sets.filter(s=>s.id!==id);
  save();
  render();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

let activeTab = 'log';
let selectedEx = null;
let chartMetric = 'e1rm';

document.getElementById('tab-log').onclick = () => switchTab('log');
document.getElementById('tab-progress').onclick = () => switchTab('progress');
document.getElementById('tab-logs').onclick = () => switchTab('logs');
document.getElementById('tab-exercises').onclick = () => switchTab('exercises');

function switchTab(tab){
  activeTab = tab;
  const idx = { log:0, progress:1, logs:2, exercises:3 }[tab];
  document.getElementById('tabs-thumb').style.transform = 'translateX(' + (idx*100) + '%)';
  document.getElementById('tab-log').classList.toggle('on', tab==='log');
  document.getElementById('tab-progress').classList.toggle('on', tab==='progress');
  document.getElementById('tab-logs').classList.toggle('on', tab==='logs');
  document.getElementById('tab-exercises').classList.toggle('on', tab==='exercises');
  document.getElementById('view-log').classList.toggle('on', tab==='log');
  document.getElementById('view-progress').classList.toggle('on', tab==='progress');
  document.getElementById('view-logs').classList.toggle('on', tab==='logs');
  document.getElementById('view-exercises').classList.toggle('on', tab==='exercises');
  if(tab==='progress'){ renderInsights(); renderProgress(); }
  if(tab==='logs'){ logsUserCleared = false; renderLogsTab(); }
  if(tab==='exercises') renderMyExercises();
}

function renderLogsTab(){
  const listEl = document.getElementById('logs-list');
  const detailEl = document.getElementById('logs-detail');
  const viewLogs = document.getElementById('view-logs');

  const completed = workoutSessions.filter(w=>w.completed).sort((a,b)=>b.timestamp-a.timestamp);

  if(completed.length===0){
    listEl.innerHTML = '<div class="empty">No completed workouts yet. Finish a session and it will show up here.</div>';
    detailEl.innerHTML = '';
    viewLogs.classList.remove('showing-detail');
    return;
  }

  // Auto-select the newest session on desktop, where both panels are visible together —
  // but never on mobile, where Logs should open to the list first (per mobile requirements),
  // and never fight an explicit "Back to Logs" press either way.
  const isDesktop = window.matchMedia('(min-width:1024px)').matches;
  if(!selectedLogSession && !logsUserCleared && isDesktop){
    selectedLogSession = completed[0].id;
  }

  const workoutNames = [...new Set(Object.values(PROGRAM_DATA).map(p=>p.name))];
  const now = Date.now();
  const rangeMs = logsRangeFilter==='7' ? 7*86400000 : logsRangeFilter==='30' ? 30*86400000 : null;

  const filtered = completed.filter(w=>
    (logsFilter==='all' || w.workoutName===logsFilter) &&
    (rangeMs===null || (now - w.timestamp) <= rangeMs)
  );

  let html = '<div class="logs-filters">';
  html += '<button class="day-pill'+(logsFilter==='all'?' on':'')+'" data-logsfilter="all">All</button>';
  workoutNames.forEach(n=>{
    html += '<button class="day-pill'+(logsFilter===n?' on':'')+'" data-logsfilter="'+escapeHtml(n)+'">'+escapeHtml(n)+'</button>';
  });
  html += '</div>';
  html += '<div class="logs-filters logs-range-filters">';
  [['7','7 days'],['30','30 days'],['all','All time']].forEach(([val,label])=>{
    html += '<button class="day-pill'+(logsRangeFilter===val?' on':'')+'" data-logsrange="'+val+'">'+label+'</button>';
  });
  html += '</div>';

  if(filtered.length===0){
    html += '<div class="empty">No workouts match this filter.</div>';
  }else{
    filtered.forEach(session=>{
      const dateTimeStr = new Date(session.timestamp).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})
        + ' • ' + new Date(session.timestamp).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
      html += '<div class="log-card'+(selectedLogSession===session.id?' selected':'')+'" data-logselect="'+session.id+'">'
        +'<div class="log-card-top"><span class="log-card-name">'+escapeHtml(session.workoutName)+'</span><span class="log-card-date">'+dateTimeStr+'</span></div>'
        +'<div class="log-card-stats">'+session.duration+' min · '+session.setCount+' working sets · '+session.totalReps+' reps</div>'
        +'<div class="log-card-stats">'+Math.round(session.volume).toLocaleString()+'kg volume'+(session.prCount>0?' · '+session.prCount+' PR'+(session.prCount>1?'s':''):'')+'</div>'
        +'<button type="button" class="log-view-btn" data-logselect="'+session.id+'">View Workout</button>'
      +'</div>';
    });
  }
  listEl.innerHTML = html;

  listEl.querySelectorAll('[data-logsfilter]').forEach(btn=>{
    btn.onclick = ()=>{ logsFilter = btn.getAttribute('data-logsfilter'); renderLogsTab(); };
  });
  listEl.querySelectorAll('[data-logsrange]').forEach(btn=>{
    btn.onclick = ()=>{ logsRangeFilter = btn.getAttribute('data-logsrange'); renderLogsTab(); };
  });
  listEl.querySelectorAll('[data-logselect]').forEach(btn=>{
    btn.onclick = ()=>{ selectedLogSession = btn.getAttribute('data-logselect'); renderLogsTab(); };
  });

  if(selectedLogSession){
    const session = workoutSessions.find(w=>w.id===selectedLogSession);
    if(session){
      detailEl.innerHTML = buildSessionDetailHTML(session) + '<button type="button" class="add-warmup-link logs-back-btn" id="logs-back-btn">← Back to Logs</button>';
      document.getElementById('logs-back-btn').onclick = ()=>{ selectedLogSession=null; logsUserCleared=true; renderLogsTab(); };
      viewLogs.classList.add('showing-detail');
    }else{
      selectedLogSession = null;
      detailEl.innerHTML = '<div class="empty">Select a workout to view its details.</div>';
      viewLogs.classList.remove('showing-detail');
    }
  }else{
    detailEl.innerHTML = '<div class="empty">Select a workout to view its details.</div>';
    viewLogs.classList.remove('showing-detail');
  }
}

function isExerciseInDay(dayIndex, exerciseId){
  const prog = PROGRAM_DATA[dayIndex];
  if(!prog) return false;
  return getEffectiveProgram(prog).some(e=>e.id===exerciseId);
}

function toggleExerciseInDay(dayIndex, name){
  const prog = PROGRAM_DATA[dayIndex];
  if(!prog) return;
  const id = resolveExerciseIdByName(name);
  if(!EXERCISE_LIBRARY[id] && !customExercises[id]){
    customExercises[id] = { name, primaryMuscle:'', secondaryMuscles:[], type:'isolation', alternatives:[] };
  }
  if(!programOverrides[prog.name]) programOverrides[prog.name] = { removed:[], added:[] };
  const overrides = programOverrides[prog.name];
  const inBase = prog.exercises.some(e=>e.id===id);
  const currentlyIncluded = isExerciseInDay(dayIndex, id);

  if(currentlyIncluded){
    // Turning it off
    if(inBase) overrides.removed.push(id);
    else overrides.added = (overrides.added||[]).filter(a=>a.id!==id);
  }else{
    // Turning it on
    if(inBase) overrides.removed = (overrides.removed||[]).filter(rid=>rid!==id);
    else overrides.added.push({ id, sets:3, repMin:8, repMax:12, rest:90, section:'Added' });
  }
  saveProgramOverrides();
  renderMyExercises();
}

function renderMyExercises(){
  const list = document.getElementById('my-exercises-list');
  if(myExercises.length === 0){
    list.innerHTML = '<div class="empty">No saved exercises yet. Add some above, then assign each one to a day in your split.</div>';
    return;
  }
  const dayEntries = Object.keys(PROGRAM_DATA).map(idx=>[Number(idx), PROGRAM_DATA[idx].name]);

  list.innerHTML = myExercises.map(n => {
    const id = resolveExerciseIdByName(n);
    const pills = dayEntries.map(([dayIdx,dayName])=>
      '<button class="day-assign-pill'+(isExerciseInDay(dayIdx,id)?' on':'')+'" data-assign="'+dayIdx+':'+escapeHtml(n)+'">'+escapeHtml(dayName)+'</button>'
    ).join('');
    return '<div class="my-ex-row-full">'
      +'<div class="my-ex-row"><span>'+escapeHtml(n)+'</span><button class="icon-btn del" data-remove-ex="'+escapeHtml(n)+'" aria-label="Remove">Del</button></div>'
      +'<div class="day-assign-row">'+pills+'</div>'
    +'</div>';
  }).join('');

  list.querySelectorAll('[data-remove-ex]').forEach(btn=>{
    btn.onclick = () => {
      myExercises = myExercises.filter(n => n !== btn.getAttribute('data-remove-ex'));
      saveExercises();
      renderMyExercises();
      render();
    };
  });
  list.querySelectorAll('[data-assign]').forEach(btn=>{
    btn.onclick = () => {
      const [dayIdx, name] = btn.getAttribute('data-assign').split(':');
      toggleExerciseInDay(Number(dayIdx), name);
      if(activeDayIndex === Number(dayIdx)){ renderTodayDashboard(); renderWorkoutCards(); }
    };
  });
}

document.getElementById('ex-add-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const input = document.getElementById('new-ex-name');
  const names = input.value.split('\n').map(n=>n.trim()).filter(Boolean);
  if(names.length === 0) return;
  const existingLower = myExercises.map(n=>n.toLowerCase());
  let added = 0;
  names.forEach(name=>{
    if(!existingLower.includes(name.toLowerCase())){
      myExercises.push(name);
      existingLower.push(name.toLowerCase());
      added++;
    }
  });
  saveExercises();
  input.value = '';
  renderMyExercises();
  render();
});


function sessionKeyForSet(s){
  // New sets always carry a real sessionId — group strictly by that, so two sessions on the
  // same calendar day never merge. Legacy sets logged before sessionId existed have no such
  // field; for those, date+workout-type is the most it's honest to reconstruct (that really was
  // the only session boundary that existed at the time), so they fall back to that.
  return s.sessionId ? s.sessionId : ('legacy_'+fmtDateKey(s.timestamp)+'_'+(s.workoutDay||'unknown'));
}

function e1rm(weight, reps){
  const w = Number(weight)||0;
  const r = Number(reps)||1;
  if(w === 0) return 0;
  return w * (1 + r/30);
}

function renderInsights(){
  const el = document.getElementById('insights');
  if(sets.length === 0){ el.innerHTML=''; return; }

  const dayKeys = [...new Set(sets.map(s=>fmtDateKey(s.timestamp)))]
    .map(k=>new Date(k)).sort((a,b)=>a-b);

  const today = new Date(); today.setHours(0,0,0,0);
  const daysBack = 83;
  const start = new Date(today); start.setDate(start.getDate()-daysBack);
  const trainedSet = new Set(dayKeys.map(d=>d.toDateString()));

  const countsByDay = {};
  sets.forEach(s=>{
    const k = fmtDateKey(s.timestamp);
    countsByDay[k] = (countsByDay[k]||0)+1;
  });

  let cells = '';
  for(let i=0;i<=daysBack;i++){
    const d = new Date(start); d.setDate(d.getDate()+i);
    const key = d.toDateString();
    const c = countsByDay[key]||0;
    let cls = 'heat-cell';
    if(c>=6) cls += ' l3'; else if(c>=3) cls += ' l2'; else if(c>=1) cls += ' l1';
    cells += '<div class="'+cls+'" title="'+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+': '+c+' set'+(c===1?'':'s')+'"></div>';
  }

  let streak = 0, cursor = new Date(today);
  while(trainedSet.has(cursor.toDateString())){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  const last7 = [...Array(7)].reduce((acc,_,i)=>{
    const d = new Date(today); d.setDate(d.getDate()-i);
    return acc + (trainedSet.has(d.toDateString())?1:0);
  },0);

  el.innerHTML = '<div class="chart-card">'
    +'<h3 style="font-size:14px;">Training consistency</h3>'
    +'<div class="chart-meta">Last 12 weeks &middot; darker = more sets that day</div>'
    +'<div class="heat-wrap"><div class="heat-grid">'+cells+'</div></div>'
    +'<div class="heat-legend"><span>Less</span><div class="heat-cell"></div><div class="heat-cell l1"></div><div class="heat-cell l2"></div><div class="heat-cell l3"></div><span>More</span></div>'
    +'<div class="streak-row">'
      +'<div class="stat"><div class="lbl">Day streak</div><div class="val">'+streak+'</div></div>'
      +'<div class="stat"><div class="lbl">Days last 7</div><div class="val">'+last7+'/7</div></div>'
    +'</div>'
  +'</div>';
}

function trendBadge(sessions, isAssistance){
  if(sessions.length < 2) return '<span class="trend-badge trend-flat">— No trend yet</span>';
  const last = performanceScore(sessions[sessions.length-1].top.weight, sessions[sessions.length-1].top.reps, isAssistance);
  const prev = performanceScore(sessions[sessions.length-2].top.weight, sessions[sessions.length-2].top.reps, isAssistance);
  const diff = last - prev;
  const pct = prev ? (diff/prev*100) : 0;
  if(Math.abs(pct) < 1) return '<span class="trend-badge trend-flat">→ Holding steady</span>';
  if(diff > 0) return '<span class="trend-badge trend-up">↑ Up '+pct.toFixed(1)+'% vs last session</span>';
  return '<span class="trend-badge trend-down">↓ Down '+Math.abs(pct).toFixed(1)+'% — check recovery/form</span>';
}

function renderProgress(){
  const exNames = [...new Set(sets.map(s=>s.exercise))].sort();
  const pick = document.getElementById('ex-pick');
  const content = document.getElementById('progress-content');

  if(exNames.length === 0){
    pick.innerHTML = '';
    content.innerHTML = '<div class="empty">Log a few sets first, then come back here to see your progression per exercise.</div>';
    return;
  }
  if(!selectedEx || !exNames.includes(selectedEx)) selectedEx = exNames[0];

  pick.innerHTML = exNames.map(n =>
    '<button data-pick="'+escapeHtml(n)+'" class="'+(n===selectedEx?'on':'')+'">'+escapeHtml(n)+'</button>'
  ).join('');
  pick.querySelectorAll('[data-pick]').forEach(btn=>{
    btn.onclick = () => { selectedEx = btn.getAttribute('data-pick'); renderProgress(); };
  });

  const exSets = sets.filter(s=>s.exercise===selectedEx).sort((a,b)=>a.timestamp-b.timestamp);
  const bySession = {};
  exSets.forEach(s=>{
    const key = sessionKeyForSet(s);
    if(!bySession[key]) bySession[key] = { timestamp:s.timestamp, top:s, sets:[] };
    bySession[key].sets.push(s);
    if(s.timestamp < bySession[key].timestamp) bySession[key].timestamp = s.timestamp;
    const isAssist = s.exerciseId && EXERCISE_LIBRARY[s.exerciseId] && EXERCISE_LIBRARY[s.exerciseId].assistance;
    if(performanceScore(s.weight, s.reps, isAssist) > performanceScore(bySession[key].top.weight, bySession[key].top.reps, isAssist)) bySession[key].top = s;
  });
  const sessions = Object.values(bySession).sort((a,b)=>a.timestamp-b.timestamp);
  const isAssistanceEx = sessions.length && sessions[0].top.exerciseId && EXERCISE_LIBRARY[sessions[0].top.exerciseId] && EXERCISE_LIBRARY[sessions[0].top.exerciseId].assistance;
  const bestScoreSet = sessions.reduce((best,d)=> performanceScore(d.top.weight,d.top.reps,isAssistanceEx) > performanceScore(best.top.weight,best.top.reps,isAssistanceEx) ? d : best, sessions[0]);
  const unitLabel = sessions[0].top.unit || 'kg';

  let html = '<div class="chart-card">';
  html += '<h3>'+escapeHtml(selectedEx)+'</h3>';
  html += '<div class="chart-meta">'+sessions.length+' session'+(sessions.length===1?'':'s')+' logged'
    +(isAssistanceEx
      ? ' &middot; least assistance <span class="pr-badge">'+bestScoreSet.top.weight+unitLabel+'</span>'
      : ' &middot; best est. 1RM <span class="pr-badge">'+Math.round(e1rm(bestScoreSet.top.weight,bestScoreSet.top.reps))+unitLabel+'</span>')
    +'</div>';
  html += '<div style="margin-bottom:8px;">'+trendBadge(sessions, isAssistanceEx)+'</div>';
  html += '<div class="metric-toggle">'
    +'<button data-metric="e1rm" class="'+(chartMetric==='e1rm'?'on':'')+'">'+(isAssistanceEx?'Performance':'Est. 1RM')+'</button>'
    +'<button data-metric="weight" class="'+(chartMetric==='weight'?'on':'')+'">'+(isAssistanceEx?'Assistance':'Top weight')+'</button>'
    +'<button data-metric="volume" class="'+(chartMetric==='volume'?'on':'')+'">Session volume</button>'
    +'</div>';
  html += drawChart(sessions, chartMetric, unitLabel, isAssistanceEx);
  html += '</div>';

  html += '<div class="chart-card"><h3 style="font-size:14px;margin-bottom:8px;">Session history</h3>';
  sessions.slice().reverse().forEach((d,i)=>{
    const dateLabel = new Date(d.timestamp).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' • '+new Date(d.timestamp).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
    const setSummary = d.sets.map(s=> (s.weight? s.weight+s.unit : 'BW') + '\u00d7' + s.reps).join(', ');
    html += '<div class="hist-row"><span class="hd">'+dateLabel+'</span><span>'+setSummary+'</span></div>';
  });
  html += '</div>';

  content.innerHTML = html;
  content.querySelectorAll('[data-metric]').forEach(btn=>{
    btn.onclick = () => { chartMetric = btn.getAttribute('data-metric'); renderProgress(); };
  });
}

function metricValue(day, metric, isAssistance){
  if(metric === 'e1rm') return isAssistance ? performanceScore(day.top.weight, day.top.reps, true) : e1rm(day.top.weight, day.top.reps);
  if(metric === 'weight') return Number(day.top.weight)||0;
  if(metric === 'volume') return day.sets.reduce((a,s)=>a+(Number(s.weight)||0)*Number(s.reps),0);
  return 0;
}

function drawChart(sessions, metric, unitLabel, isAssistance){
  const W = 460, H = 150, pad = 26;
  const values = sessions.map(d=>metricValue(d, metric, isAssistance));
  const min = Math.min(...values, 0), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = sessions.length > 1 ? (W - pad*2) / (sessions.length - 1) : 0;

  const points = sessions.map((d,i)=>{
    const x = sessions.length > 1 ? pad + i*stepX : W/2;
    const v = metricValue(d, metric, isAssistance);
    const y = H - pad - ((v - min) / range) * (H - pad*2);
    return {x,y,v,d};
  });

  let bestIdx = 0;
  points.forEach((p,i)=>{ if(p.v > points[bestIdx].v) bestIdx = i; });

  const linePath = points.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = linePath + ' L'+points[points.length-1].x.toFixed(1)+','+(H-pad)+' L'+points[0].x.toFixed(1)+','+(H-pad)+' Z';

  const suffix = metric === 'volume' ? '' : unitLabel;

  let svg = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:150px;overflow:visible;">';
  svg += '<defs><linearGradient id="fadeGrad" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="var(--accent)" stop-opacity="0.25"/>'
    +'<stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>';
  svg += '<path d="'+areaPath+'" fill="url(#fadeGrad)"/>';
  svg += '<path d="'+linePath+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>';
  points.forEach((p,i)=>{
    const isBest = i===bestIdx;
    const isLast = i===points.length-1;
    svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isBest?5.5:4)+'" fill="'+(isBest?'var(--success)':'var(--accent)')+'" stroke="var(--bg)" stroke-width="1.5"/>';
    if(isBest || isLast){
      svg += '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-11).toFixed(1)+'" fill="var(--text)" font-size="11" font-family="monospace" text-anchor="middle">'+Math.round(p.v)+suffix+'</text>';
    }
  });
  svg += '</svg>';
  return svg;
}

document.getElementById('add-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  const exercise = document.getElementById('f-exercise').value.trim();
  const weight = document.getElementById('f-weight').value;
  const reps = document.getElementById('f-reps').value;
  if(!exercise){ alert('Enter an exercise name.'); return; }
  if(!reps || Number(reps) <= 0){ alert('Enter a valid rep count.'); return; }

  sets.push({
    id: 'set_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    exercise,
    weight: weight ? Number(weight) : 0,
    reps: Number(reps),
    unit,
    timestamp: Date.now()
  });
  save();
  render();

  document.getElementById('f-reps').value = '';
  document.getElementById('f-exercise').focus();
});
